version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (net.Conn).Close
      - (database/sql.Rows).Close
      - (database/sql.DB).Close
      - (*os.File).Close
      - os.Setenv
      - os.Chdir
      - os.Chmod
      - (os.File).Close

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 10
